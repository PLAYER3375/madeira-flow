name: Python e regras de negocio
on: [push, pull_request]
jobs:
  verificar:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Regras e persistencia
        run: python scripts/verificar.py
      - name: Interface no Windows
        if: runner.os == 'Windows'
        env:
          RUN_GUI_TESTS: '1'
        run: python scripts/verificar.py
      - name: Empacotar
        run: python scripts/empacotar.py
      - uses: actions/upload-artifact@v4
        with:
          name: MadeiraFlow-${{ matrix.os }}-Python-${{ matrix.python }}
          path: |
            build/resultados-testes.txt
            dist/MadeiraFlow.pyz
